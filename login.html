<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Melvox</title>
<meta name="theme-color" content="#13131a">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{box-sizing:border-box;--bg:#13131a;--panel:#13131a;--card:#25252f;--line:#2b2b37;--text:#f2f2f6;--muted:#b9b9c9;--accent:#5b3de8;--err:#ff7a8a;
--bevel:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{position:relative;width:100%;max-width:340px;padding:18px 16px 16px;border-radius:18px;background-color:var(--card);box-shadow:var(--bevel)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.035) 32%,rgba(255,255,255,.01) 62%,rgba(255,255,255,.08));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.3em}
.sub{margin:6px 0 14px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:14px;margin-bottom:2px}
.tabs button{height:28px;padding:0 5px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
label{display:block;margin:12px 0 5px;font-size:12.5px;font-weight:500;color:var(--muted)}
input{width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px}
input:focus{outline:0}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tokRow[hidden]{display:none}
.go{width:100%;height:44px;margin-top:18px;border:0;border-radius:22px;background:#f2f2f6;color:#16161d;font:inherit;font-weight:700;cursor:pointer}
.go:hover{background:#fff}
.go:disabled{opacity:.6;cursor:default}
.err{min-height:18px;margin:12px 0 0;color:var(--err);font-size:13px}
.note{margin:10px 0 0;color:var(--muted);font-size:12.5px}

:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
body::before{content:"";position:fixed;left:50%;top:-20%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:radial-gradient(closest-side,rgba(91,61,232,.16),transparent);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-60px,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}
.card{animation:cardIn .7s var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
.rise{animation:rise .6s var(--out) backwards;animation-delay:calc(var(--i,0)*70ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:14px}
.logo{position:relative;width:52px;height:52px;flex:none;animation:pop .8s var(--spring) .2s backwards,float 5s ease-in-out 1.2s infinite}
.logo img{display:block;width:100%;height:100%;border-radius:15px}
.logo::after{content:"";position:absolute;inset:0;border-radius:15px;animation:glow 3.2s ease-in-out 1s infinite;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(91,61,232,.0)}50%{box-shadow:0 0 18px 2px rgba(91,61,232,.5)}}
.brand h1{flex:1}
.eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.eq i{display:block;width:3px;height:100%;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:.8s;animation-delay:-.3s}.eq i:nth-child(3){animation-duration:1.3s;animation-delay:-.6s}.eq i:nth-child(4){animation-duration:.95s;animation-delay:-.1s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.sub{margin-top:12px}
.tabs{position:relative}
.tabs button{transition:color .25s ease,transform .15s ease;border-bottom-color:transparent!important}
.tabs button:active{transform:scale(.94)}
.ind{position:absolute;left:0;bottom:0;height:2px;width:0;border-radius:2px;background:var(--accent);transition:transform .45s var(--spring),width .35s var(--out)}
#tokRow:not([hidden]){animation:rise .4s var(--out)}
input{transition:border-color .2s ease,transform .2s var(--out)}
input:focus{border-color:rgba(91,61,232,.7)}
.go{transition:background-color .2s ease,transform .15s ease}
.go:active:not(:disabled){transform:scale(.97)}
.go:disabled{animation:busy 1s ease-in-out infinite}
@keyframes busy{50%{opacity:.4}}
.err:not(:empty){animation:rise .35s var(--out)}
.card.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
body.leaving .card{transition:transform .38s ease-in,opacity .38s ease-in;transform:scale(1.05) translateY(-10px);opacity:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="brand rise" style="--i:0">
    <div class="logo"><img src="/icons/icon-192.png" alt="" width="52" height="52"></div>
    <h1>MELVOX</h1>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <p class="sub rise" style="--i:1">Versi penuh. Masuk dengan akunmu.</p>
  <div class="tabs rise" style="--i:2" role="tablist">
    <span class="ind" id="ind"></span>
    <button type="button" role="tab" id="tLogin" aria-selected="true">Masuk</button>
    <button type="button" role="tab" id="tRedeem" aria-selected="false">Aktifkan token</button>
  </div>
  <form id="f" class="rise" style="--i:3" autocomplete="on">
    <div id="tokRow" hidden>
      <label for="token">Token dari pembelian</label>
      <input id="token" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MLVX-XXXX-XXXX-XXXX-XXXX">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password <span id="pwHint"></span></label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="go" id="go" type="submit">Masuk</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="note rise" style="--i:4" id="note">Satu token hanya untuk satu akun dan beberapa perangkat terbatas.</p>
</main>
<script>
(function () {
  var mode = 'login', $ = function (id) { return document.getElementById(id); };
  function set(m) {
    mode = m;
    $('tLogin').setAttribute('aria-selected', m === 'login'); $('tRedeem').setAttribute('aria-selected', m === 'redeem');
    $('tokRow').hidden = m !== 'redeem';
    $('token').required = m === 'redeem';
    $('pw').autocomplete = m === 'redeem' ? 'new-password' : 'current-password';
    $('pwHint').textContent = m === 'redeem' ? '(buat password baru, min. 8 karakter)' : '';
    $('go').textContent = m === 'redeem' ? 'Aktifkan & masuk' : 'Masuk';
    $('err').textContent = '';
    moveInd();
  }
  function moveInd() { var b = document.querySelector('.tabs [aria-selected=true]'), i = $('ind'); if (b && i) { i.style.width = b.offsetWidth + 'px'; i.style.transform = 'translateX(' + b.offsetLeft + 'px)'; } }
  function shake() { var c = document.querySelector('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  $('tLogin').onclick = function () { set('login'); };
  $('tRedeem').onclick = function () { set('redeem'); };
  moveInd(); addEventListener('resize', moveInd); addEventListener('load', moveInd);
  var q = new URLSearchParams(location.search);
  if (q.get('token')) { set('redeem'); $('token').value = q.get('token'); }
  function nextUrl() { var n = q.get('next') || '/'; return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/'; }   // cegah open-redirect
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true;
    fetch('/api/session', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: mode, email: $('email').value, password: $('pw').value, token: $('token').value })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok) { try { localStorage.setItem('mx_last_ok', String(Date.now())); } catch (_) {} document.body.classList.add('leaving'); setTimeout(function () { location.replace(nextUrl()); }, 380); return; }
        $('err').textContent = x.d.error || 'Gagal masuk.'; $('go').disabled = false; shake();
      })
      .catch(function () { $('err').textContent = 'Tidak bisa terhubung. Periksa internetmu.'; $('go').disabled = false; shake(); });
  });
})();
</script>
</body>
</html>
