<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Melvox</title>
<meta name="theme-color" content="#16161c">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{box-sizing:border-box;--bg:#16161c;--panel:#1e1e26;--line:#33333f;--text:#e8e8f0;--muted:#8a8a9a;--accent:#a66cff;--err:#ff7a8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.04em}
.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.tabs button{padding:9px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:rgba(166,108,255,.16);border-color:var(--accent);color:var(--text)}
label{display:block;margin:12px 0 5px;font-size:12px;color:var(--muted)}
input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
#tokRow[hidden]{display:none}
.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#14101f;font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.err{min-height:18px;margin:12px 0 0;color:var(--err);font-size:13px}
.note{margin:14px 0 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="card">
  <h1>MELVOX</h1>
  <p class="sub">Versi penuh. Masuk dengan akunmu.</p>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tLogin" aria-selected="true">Masuk</button>
    <button type="button" role="tab" id="tRedeem" aria-selected="false">Aktifkan token</button>
  </div>
  <form id="f" autocomplete="on">
    <div id="tokRow" hidden>
      <label for="token">Token dari pembelian</label>
      <input id="token" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MLVX-XXXX-XXXX-XXXX-XXXX">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password <span id="pwHint"></span></label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="go" id="go" type="submit">Masuk</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="note" id="note">Satu token hanya untuk satu akun dan beberapa perangkat terbatas.</p>
</main>
<script>
(function () {
  var mode = 'login', $ = function (id) { return document.getElementById(id); };
  function set(m) {
    mode = m;
    $('tLogin').setAttribute('aria-selected', m === 'login'); $('tRedeem').setAttribute('aria-selected', m === 'redeem');
    $('tokRow').hidden = m !== 'redeem';
    $('token').required = m === 'redeem';
    $('pw').autocomplete = m === 'redeem' ? 'new-password' : 'current-password';
    $('pwHint').textContent = m === 'redeem' ? '(buat password baru, min. 8 karakter)' : '';
    $('go').textContent = m === 'redeem' ? 'Aktifkan & masuk' : 'Masuk';
    $('err').textContent = '';
  }
  $('tLogin').onclick = function () { set('login'); };
  $('tRedeem').onclick = function () { set('redeem'); };
  var q = new URLSearchParams(location.search);
  if (q.get('token')) { set('redeem'); $('token').value = q.get('token'); }
  function nextUrl() { var n = q.get('next') || '/'; return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/'; }   // cegah open-redirect
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true;
    fetch('/api/session', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: mode, email: $('email').value, password: $('pw').value, token: $('token').value })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok) { try { localStorage.setItem('mx_last_ok', String(Date.now())); } catch (_) {} location.replace(nextUrl()); return; }
        $('err').textContent = x.d.error || 'Gagal masuk.'; $('go').disabled = false;
      })
      .catch(function () { $('err').textContent = 'Tidak bisa terhubung. Periksa internetmu.'; $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
