<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Melvox</title>
<meta name="theme-color" content="#16161c">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{box-sizing:border-box;--bg:#16161c;--panel:#1e1e26;--panel2:#252530;--line:#33333f;--text:#e8e8f0;--muted:#8a8a9a;--accent:#a66cff;--accent-soft:rgba(166,108,255,.16);--err:#ff7a8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--text);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
background:radial-gradient(600px 300px at 50% 0,rgba(166,108,255,.14),transparent 70%),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/64px 64px,var(--bg)}
.card{position:relative;width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px 22px 26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.brand img{width:44px;height:44px;border-radius:10px;flex:none}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3em}
.sub{margin:3px 0 0;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:6px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tabs button{padding:8px;border-radius:7px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
label{display:block;margin:14px 0 5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#tokRow[hidden]{display:none}
.go{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#14101f;font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(166,108,255,.28)}
.go:disabled{opacity:.6;cursor:default}
.err{min-height:18px;margin:12px 0 0;color:var(--err);font-size:13px}
.note{margin:12px 0 0;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="/icons/icon-192.png" alt="" width="44" height="44">
    <div><h1>MELVOX</h1><p class="sub">Full version &middot; Masuk dengan akunmu</p></div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tLogin" aria-selected="true">Masuk</button>
    <button type="button" role="tab" id="tRedeem" aria-selected="false">Aktifkan token</button>
  </div>
  <form id="f" autocomplete="on">
    <div id="tokRow" hidden>
      <label for="token">Token dari pembelian</label>
      <input id="token" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MLVX-XXXX-XXXX-XXXX-XXXX">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password <span id="pwHint"></span></label>
    <input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="go" id="go" type="submit">Masuk</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="note" id="note">Satu token hanya untuk satu akun dan beberapa perangkat terbatas.</p>
</main>
<script>
(function () {
  var mode = 'login', $ = function (id) { return document.getElementById(id); };
  function set(m) {
    mode = m;
    $('tLogin').setAttribute('aria-selected', m === 'login'); $('tRedeem').setAttribute('aria-selected', m === 'redeem');
    $('tokRow').hidden = m !== 'redeem';
    $('token').required = m === 'redeem';
    $('pw').autocomplete = m === 'redeem' ? 'new-password' : 'current-password';
    $('pwHint').textContent = m === 'redeem' ? '(buat password baru, min. 8 karakter)' : '';
    $('go').textContent = m === 'redeem' ? 'Aktifkan & masuk' : 'Masuk';
    $('err').textContent = '';
  }
  $('tLogin').onclick = function () { set('login'); };
  $('tRedeem').onclick = function () { set('redeem'); };
  var q = new URLSearchParams(location.search);
  if (q.get('token')) { set('redeem'); $('token').value = q.get('token'); }
  function nextUrl() { var n = q.get('next') || '/'; return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/'; }   // cegah open-redirect
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').textContent = ''; $('go').disabled = true;
    fetch('/api/session', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: mode, email: $('email').value, password: $('pw').value, token: $('token').value })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok) { try { localStorage.setItem('mx_last_ok', String(Date.now())); } catch (_) {} location.replace(nextUrl()); return; }
        $('err').textContent = x.d.error || 'Gagal masuk.'; $('go').disabled = false;
      })
      .catch(function () { $('err').textContent = 'Tidak bisa terhubung. Periksa internetmu.'; $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
