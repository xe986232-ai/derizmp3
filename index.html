<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web DAW</title>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="play-icon" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"/></symbol>
  <symbol id="pause-icon" viewBox="0 0 24 24"><path d="M7 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM14 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="rewind-icon" viewBox="0 0 24 24"><path d="M11.5 6.2v11.6a.7.7 0 0 1-1.1.57L1.9 12.6a.7.7 0 0 1 0-1.16l8.5-5.8a.7.7 0 0 1 1.1.56z"/><path transform="translate(9.5 0)" d="M11.5 6.2v11.6a.7.7 0 0 1-1.1.57L1.9 12.6a.7.7 0 0 1 0-1.16l8.5-5.8a.7.7 0 0 1 1.1.56z"/></symbol>
  <symbol id="forward-icon" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M11.5 6.2v11.6a.7.7 0 0 1-1.1.57L1.9 12.6a.7.7 0 0 1 0-1.16l8.5-5.8a.7.7 0 0 1 1.1.56z"/><path transform="translate(9.5 0)" d="M11.5 6.2v11.6a.7.7 0 0 1-1.1.57L1.9 12.6a.7.7 0 0 1 0-1.16l8.5-5.8a.7.7 0 0 1 1.1.56z"/></g></symbol>
</svg>

<div class="stage">
<div class="workspace">
  <!-- Daftar track -->
  <div class="tracklist secondaryactivated">
    <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-label="Tutup panel track" title="Tutup panel track"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <section class="headers" aria-label="Daftar Track">
      <div class="headers-list">
        <div class="trackheader-container" data-track="1">
          <div class="trackheader trackheader--selected trackheader--first">
            <div class="trackheader__border-left"></div>
            <div class="trackheader-inner">
              <button title="Tampilkan instrumen" class="trackheader__left-content st-button--naked">
                <span class="trackheader__instrument-button"><span class="soundtrap-icon"><svg viewBox="0 0 24 24"><path d="M23.648 3.923A1.249 1.249 0 0 0 22.4 2.678H1.6A1.248 1.248 0 0 0 .352 3.931v16.146A1.249 1.249 0 0 0 1.6 21.323h20.8a1.248 1.248 0 0 0 1.248-1.253V3.923Zm-10.089 9.63h1.165v5.272H9.287v-5.271h1.165l-.049-8.379h3.107l.05 8.379ZM2.853 5.176h2.89l.048 8.379h1.165v5.27H2.844l.009-13.649Zm14.202 13.65v-5.271h1.165l-.049-8.379h2.985l-.009 13.65h-4.092Z"/></svg></span></span>
              </button>
              <div class="trackheader__content-rows">
                <div class="trackheader__top-row">
                  <div class="trackheader__track-name">
                    <button title="Grand Piano" class="trackheader__track-name-button btn-plain"><span id="track-name-1">Grand Piano</span></button>
                  </div>
                  <button title="Opsi track…" aria-haspopup="menu" aria-expanded="false" class="icon-button trackheader__more-options"><span class="soundtrap-icon" style="width:16px;height:16px"><svg viewBox="0 0 24 24"><path d="M12 14.33a2.33 2.33 0 1 0 0-4.66 2.33 2.33 0 0 0 0 4.66Zm-6.991 0a2.33 2.33 0 1 0 0-4.66 2.33 2.33 0 0 0 0 4.66Zm13.982 0a2.33 2.33 0 1 0 0-4.66 2.33 2.33 0 0 0 0 4.66Z"/></svg></span></button>
                </div>
                <div class="trackheader__bottom-row">
                  <div class="trackheader__bottom-row-inner">
                    <button role="switch" aria-checked="false" aria-label="Mode rekam" class="trackheader__rec-mode-button st-button--naked">S</button>
                    <div class="trackheader__slider"><div class="slider-container"><div class="slider-input-wrapper"><input type="range" min="-20" max="6" value="-5.5" aria-label="Volume, Grand Piano" aria-valuenow="-5.5" aria-valuetext="Vol -5.5 dB" aria-valuemin="-20" aria-valuemax="6" step="0.1" style="--slider-progress: 56%; --slider-progress-fraction: 0.5576923076923077" aria-disabled="false" class="slider audio-fader-theme slider--thin slider--expand-hit-area with-progress"></div></div></div>
                    <div class="trackheader__pan"><div class="knob mini"><div class="knob-inner"><div role="slider" aria-label="Pan" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5" aria-valuetext="Pan 0" tabindex="0" class="knob-input"><div class="knobwheel"><svg viewBox="0 0 36 36" aria-hidden="true" class="circular-chart"><path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="75, 100" class="circle-bg" style="transform-origin:18px 18px;transform:rotate(225deg)"></path><path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dashoffset="100" stroke-dasharray="100" class="circle primary-theme" style="transform:rotate(225deg)"></path><path d="M18 5.142857142857142 a 12.857142857142858 12.857142857142858 0 0 1 0 25.714285714285715 a 12.857142857142858 12.857142857142858 0 0 1 0 -25.714285714285715" fill="var(--background-tinted-press)" stroke="none" class="circle-inner"></path><path d="M18 5.7857142857142865 a 12.214285714285714 12.214285714285714 0 0 1 0 24.428571428571427 a 12.214285714285714 12.214285714285714 0 0 1 0 -24.428571428571427" stroke="var(--background-tinted-base)" fill="none" class="circle-inner-stroke"></path><path d="M 18 7.5 L 18 12" class="knob-pos" style="transform:rotate(0deg)"></path></svg></div></div></div></div></div>
                  </div>
                </div>
              </div>
            </div>
            <div role="separator" class="trackheader-separator"></div>
          </div>
        </div>
      </div>
      <button class="addtrack"><span class="soundtrap-icon" style="width:14px;height:14px"><svg viewBox="0 0 24 24"><path d="M3.844 13.165h6.99v6.992a1.165 1.165 0 1 0 2.331 0v-6.992h6.992a1.165 1.165 0 1 0 0-2.33h-6.992V3.844a1.165 1.165 0 0 0-2.33 0v6.99H3.844a1.166 1.166 0 0 0 0 2.331Z"/></svg></span><span>Tambahkan track</span></button>
    </section>
  </div>

  <!-- Timeline -->
  <div class="timeline" id="timeline">
    <div class="timeline-controls-header-wrapper">
      <div class="beatruler composition-area-beat-ruler" id="ruler">
        <div class="beatruler-container"><canvas class="axiscanvas" id="axis" aria-label="Timeline ruler"></canvas></div>
      </div>
    </div>
    <div class="lanes" id="lanes">
      <div class="lane" data-track="1"></div>
      <div class="playhead" id="playhead">
        <div class="playhead-head"><svg width="9" height="20" viewBox="0 0 9 20"><path d="M5 0H4C1.79 0 0 1.79 0 4v8.6c0 .86.27 1.69.78 2.38L4.5 20l3.72-5.02A4 4 0 0 0 9 12.6V4c0-2.21-1.79-4-4-4Z"/></svg></div>
        <div class="playhead-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- Panel efek: menempel di sisi kanan layar, dibuka / ditutup lewat panah di tengah tepi kirinya -->
<aside class="fx" id="fxPanel" aria-label="Panel efek">
  <button class="fx__toggle" id="fxToggle" type="button" aria-expanded="true" aria-controls="fxBody" aria-label="Tutup panel efek" title="Tutup panel efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="fx__clip">
    <div class="fx__panel" id="fxBody">
      <header class="fx__head fx__item" style="--i:0"><h2 class="fx__title">Effects</h2></header>
      <div class="fx__body">
        <div class="fx__top fx__item" style="--i:1">
          <button type="button" class="fx__add" id="fxAdd" aria-haspopup="menu" aria-expanded="false" aria-label="Tambah efek" title="Tambah efek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="fx__list" id="fxList"></div>
      </div>
    </div>
  </div>
</aside>
</div>

<footer class="transportbar">
<div class="studioheader__transport-controls-mobile"><div role="group" aria-label="Kontrol transport" class="transport-controls"><div class="transport-controls__side transport-controls__side--left"><button type="button" class="hist-btn metro-btn" id="btnMetro" aria-label="Metronome dan BPM" title="Metronome &amp; BPM">M</button><button type="button" class="hist-btn" id="btnRedo" aria-label="Ulangi (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button><button data-testid="Mundur [Arrow left]" aria-label="Mundur" title="Mundur (←)" class="rewind transport-controls__button st-button--size-regular st-label-large st-button--naked"><span class="soundtrap-icon soundtrap-icon--svg ic-rewind"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#rewind-icon"></use></svg></span></button></div><button data-testid="Putar/jeda [Space]" aria-label="Putar" title="Putar/jeda (Space)" class="play transport-controls__button st-button--size-regular st-label-large st-inverted-set st-button--naked"><span class="soundtrap-icon soundtrap-icon--svg ic-play"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#play-icon"></use></svg></span></button><div class="transport-controls__side transport-controls__side--right"><button data-testid="Maju cepat [Arrow right]" aria-label="Maju cepat" title="Maju cepat (→)" class="forward transport-controls__button st-button--size-regular st-label-large st-button--naked"><span class="soundtrap-icon soundtrap-icon--svg ic-forward"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#forward-icon"></use></svg></span></button><button type="button" class="hist-btn" id="btnUndo" aria-label="Urungkan (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled>Undo</button></div></div><button class="kbd-toggle transport-controls__button st-button--naked" id="kbdToggle" type="button" aria-controls="kbd" aria-expanded="false" aria-label="Buka keyboard" title="Buka keyboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
</footer>
